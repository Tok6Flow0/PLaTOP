<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLaTOP — avatar comparison</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#edeae3;color:#293e38;font:15px/1.5 system-ui,sans-serif}header,main,footer{max-width:1120px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}h1{font-size:24px;margin:0}p{margin:5px 0;color:#657169}.controls{display:flex;align-items:center;gap:16px}select{font:inherit;border:1px solid #b8c2b8;border-radius:7px;padding:7px;background:#fafaf6;color:inherit}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;border:1px solid #d3d4ca;border-radius:10px;overflow:hidden;background:#fafaf6}figcaption{padding:12px 18px;font-weight:650;border-bottom:1px solid #dedfd7}img{display:block;width:100%;aspect-ratio:1;object-fit:contain}footer{font-size:13px;margin-top:18px;color:#657169}@media(max-width:760px){header{display:block}.controls{margin-top:12px}main{grid-template-columns:1fr}body{padding:16px}}
</style>
<header><div><h1>Portrait to presence</h1><p>A direct comparison of the chosen identity and its live 3D embodiment.</p></div><div class="controls"><select aria-label="Team"><option value="merchant">Savor Bridge</option><option value="hr">Clear Path</option><option value="intake">Savor Wayfinders</option><option value="support">Beacon</option><option value="reflection">The Lantern Desk</option><option value="email">Savor Dispatch</option></select><label><input type="checkbox" id="night"> Night render</label></div></header>
<main><figure><figcaption>Agent's original image</figcaption><img id="reference" alt="Original identity reference"></figure><figure><figcaption>Actual model render</figcaption><img id="render" alt="Rendered office character models"></figure></main>
<footer>The rendered side uses the same geometry as the office. This development-only comparison does not connect to chats, report activity, or command agents.</footer>
<script type="module">
if(!import.meta.env.DEV)throw Error('Development fixture only');
const team=document.querySelector('select'),night=document.querySelector('#night');
function show(){document.querySelector('#reference').src=`/portraits/${team.value}.png`;document.querySelector('#render').src=`/avatars/team-${team.value}${night.checked?'-night':''}.png`;}
team.addEventListener('change',show);night.addEventListener('change',show);show();
</script></html>
